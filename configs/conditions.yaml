noise_source: data/noise/source        # DEMAND 16kHz 數個環境（ch01），或機器人本體錄音
# DEMAND（CC BY 4.0，doi:10.5281/zenodo.1227121）16k 版，各取 ch01；避開含人聲的 OMEETING、PCAFETER
noise_files: [DKITCHEN, DLIVING, DWASHING, OOFFICE]
noise_holdout_sec: 60.0                # 每個噪音源最後 60 秒只給 noise_only 用，不用於疊加
conditions:
  clean:   {}
  snr20:   { type: noise, snr_db: 20 }
  snr10:   { type: noise, snr_db: 10 }
  snr05:   { type: noise, snr_db: 5 }
  snr00:   { type: noise, snr_db: 0 }
  snrm05:  { type: noise, snr_db: -5 }   # 負 SNR（m = minus）：噪音比語音大，Round 2 起
  snrm10:  { type: noise, snr_db: -10 }
  reverb:  { type: reverb, rt60: 0.6, room_dim: [5.0, 4.0, 3.0], src_mic_distance: 2.5, geometry_seed: 42 }
  lowvol:  { type: volume, gain_db: -20 }
  # rms_dbfs：clean 語音 RMS 中位數 −21.9 dBFS，−32 約等於 snr10 時的噪音大小
  noise_only: { type: noise_only, n_clips: 10, clip_sec: 5.0, rms_dbfs: -32.0 }
