name: round2
seed: 42
device: cpu          # Jetson 上改為 cuda
dtype: fp32          # Jetson 部署預計為 q4，以部署版本另行複驗（plan.md 11.5）
num_threads: 4

paths:
  raw:                                 # 與 round1 相同的抽樣（不重跑 01_prepare_data）
    female: data/raw/female
    male: data/raw/male
  manifest: data/clean/manifest.csv
  degraded_dir: data/degraded
  output_dir: results/round2

sampling:
  tsv_name: test.tsv
  n_per_gender: 25
  min_sec: 3.0
  max_sec: 8.0
  min_words: 5
  max_down_votes: 0
  one_per_speaker: true

models:
  - granite-470m
  # - parakeet-tdt-v2   # 暫緩：需 Linux 環境（NeMo）
  - whisper-small
  - qwen3-asr-0.6b

# A：loudnorm / vad+loudnorm；B：較溫和的 denoise；vad、vad+denoise 對照 Round 1
methods:
  - baseline
  - vad
  - denoise
  - loudnorm
  - vad+loudnorm
  - vad+denoise

# C：負 SNR；clean 檢查方法對乾淨語音的副作用，lowvol 驗證 loudnorm（snr20/10/05、reverb 見 Round 1）
conditions: [clean, snr00, snrm05, snrm10, lowvol, noise_only]

# 只作用於本輪，取代 configs/methods/<name>.yaml（plan.md 7.1）
method_params:
  denoise:
    impl: noisereduce
    params: { prop_decrease: 0.5 }   # Round 1 預設 1.0 會使 WER 顯著變差；改為只壓低一半（docs/decisions.md）

conditions_file: configs/conditions.yaml
normalizer: english
save_processed: false
max_utterances: null   # 只取前 N 句語音（冒煙 / 除錯用）；null = 全部

meta:                  # 寫入 meta.json
  dataset: Common Voice Scripted Speech 26.0 American English (Female + Male) test
  nano_budget_mb: 8192
