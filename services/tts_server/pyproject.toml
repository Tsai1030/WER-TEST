# TTS 服務（Supertonic 3）自己的環境，與專案環境分開（專案是 Python 3.11；Jetson 的 onnxruntime-gpu 只有 3.12 版）
[project]
name = "tts-server"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "supertonic==1.3.1",
  "numpy",
  # Jetson（Linux aarch64，JetPack 7 / CUDA 13）：PyPI 的 aarch64 版沒有 Orin（sm_87）的 GPU 程式碼，改用 Jetson AI Lab 的版本；
  # CUDA / cuDNN 版本與專案 torch cu132 環境相同（已確認可在 Orin 執行）
  "onnxruntime-gpu==1.24.0; sys_platform == 'linux' and platform_machine == 'aarch64'",
  "nvidia-cudnn-cu13==9.26.0.51; sys_platform == 'linux' and platform_machine == 'aarch64'",
  "nvidia-cublas==13.4.1.3; sys_platform == 'linux' and platform_machine == 'aarch64'",
  "nvidia-cuda-runtime==13.2.86; sys_platform == 'linux' and platform_machine == 'aarch64'",
]

[tool.uv]
package = false
# supertonic 依賴 CPU 版 onnxruntime；Jetson 上與 onnxruntime-gpu 是同一個模組，只在其他平台保留 CPU 版
override-dependencies = ["onnxruntime; sys_platform != 'linux' or platform_machine != 'aarch64'"]

[[tool.uv.index]]
name = "jetson-ai-lab-cu130"
url = "https://pypi.jetson-ai-lab.io/sbsa/cu130/+simple"
explicit = true

[tool.uv.sources]
onnxruntime-gpu = { index = "jetson-ai-lab-cu130", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" }
