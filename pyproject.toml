[project]
name = "stt-wer-bench"
version = "0.1.0"
description = "STT WER 錯誤分析與改善（Round 1：英文）"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy",
  "pandas",
  "soundfile",
  "librosa",
  "pyyaml",
  "jiwer",
  "psutil",
  "tqdm",
  "torch",
  "torchaudio",
  "transformers>=5.16",
  "whisper-normalizer>=0.1.15",
  "accelerate>=1.15.0",
  "soxr>=1.1.0",
]

[project.optional-dependencies]
audio  = [
    "pyroomacoustics",
    "pyloudnorm",
    "silero-vad",
    "deepfilternet",
    "noisereduce",
    "webrtcvad-wheels>=2.0.14.post1",
]
models = [
 "faster-whisper",
]
wake = [
    "sherpa-onnx>=2.0.1",
    "sounddevice>=0.5.6",
]

[dependency-groups]
dev = ["pytest", "ruff", "mypy"]

# 開發機（Windows）用 CPU 版；Jetson（Linux aarch64，JetPack 7 / CUDA 13.2）用官方 cu132 版。
# torchaudio 沒有 cu132 的 aarch64 版，一律用 CPU 版（本專案只用到 CPU 功能）
[tool.uv.sources]
torch = [
  { index = "pytorch-cu132", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
  { index = "pytorch-cpu", marker = "sys_platform != 'linux' or platform_machine != 'aarch64'" },
]
torchaudio = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

# 讓 uv sync 以 editable 方式安裝 library/，scripts/ 與 tests/ 才能 import library
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["library"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Windows 上 faulthandler 會把 torch / torchaudio 原生程式碼內部已處理的例外印成
# "Windows fatal exception: access violation"（誤報，測試仍正常完成），故停用
addopts = "-p no:faulthandler"
filterwarnings = [
  "ignore::DeprecationWarning:silero_vad.*",
  "ignore:`torch.jit.load` is deprecated:FutureWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
